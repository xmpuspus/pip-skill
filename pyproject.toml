[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pip-skill"
dynamic = ["version"]
description = "Convert any pip package into an AI coding assistant skill (Claude Code, Cursor, Windsurf, OpenCode)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Xavier Puspus", email = "xpuspus@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Typing :: Typed",
]
keywords = ["ai", "ai-coding", "agent-skills", "claude", "claude-code", "cursor", "windsurf", "opencode", "copilot", "codex", "gemini", "mcp", "skill", "plugin", "code-generation", "llm", "developer-tools", "python-tools"]

dependencies = [
    "jinja2>=3.0",
    "docstring-parser>=0.16",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
llm = ["anthropic>=0.40"]
tui = ["textual>=0.40"]
all = ["pip-skill[mcp,llm,tui]"]
dev = [
    "pytest>=8.0",
    "pytest-tmp-files>=0.0.2",
    "ruff>=0.15,<0.16",
    "pyright>=1.1",
    "PyYAML>=6.0",
]

[project.scripts]
pip-skill = "pip_skill.cli:main"

[project.urls]
Homepage = "https://github.com/xmpuspus/pip-skill"
Documentation = "https://github.com/xmpuspus/pip-skill#readme"
Repository = "https://github.com/xmpuspus/pip-skill"
"Bug Tracker" = "https://github.com/xmpuspus/pip-skill/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pip_skill"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["eval-results", "dist", "build", ".venv", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "I", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pip_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: tests against real installed packages"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"
