name: pip-skill
description: Convert installed pip packages into AI coding assistant skills (Claude Code, Cursor, Windsurf, OpenCode, MCP)
author: Xavier Puspus
branding:
  icon: package
  color: purple

inputs:
  packages:
    description: Space-separated list of pip packages OR path to a requirements.txt file
    required: true
  format:
    description: Output format (claude, cursor, windsurf, opencode)
    required: false
    default: claude
  output-dir:
    description: Base directory for generated skills
    required: false
    default: ./skills
  mcp:
    description: Also generate FastMCP servers
    required: false
    default: "false"
  workers:
    description: Parallel workers for batch conversion
    required: false
    default: "4"
  pip-skill-version:
    description: Version of pip-skill to install (use "latest" for the most recent)
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v4

    - name: Install pip-skill
      shell: bash
      env:
        VERSION: ${{ inputs.pip-skill-version }}
      run: |
        if [ "$VERSION" = "latest" ]; then
          uv tool install pip-skill
        else
          uv tool install "pip-skill==$VERSION"
        fi

    - name: Generate skills
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        FORMAT: ${{ inputs.format }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        WORKERS: ${{ inputs.workers }}
        MCP_FLAG: ${{ inputs.mcp }}
      run: |
        ARGS="--format $FORMAT --output-dir $OUTPUT_DIR --workers $WORKERS --force"
        if [ "$MCP_FLAG" = "true" ]; then
          ARGS="$ARGS --mcp"
        fi
        # If `packages` is a single token that names an existing file, treat it
        # as a requirements file; otherwise pass tokens as package names.
        if [ -f "$PACKAGES" ]; then
          uv tool run pip-skill batch "$PACKAGES" $ARGS
        else
          uv tool run pip-skill batch $PACKAGES $ARGS
        fi
